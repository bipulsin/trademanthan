<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Kosmic Tarang - TradeWithCTO</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=3" />
    <script src="auth-check.js?v=1"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="settings.css?v=2" />
    <link rel="stylesheet" href="left-menu.css?v=3.49" />
    <link rel="stylesheet" href="theme.css?v=1.4" />
    <link rel="stylesheet" href="tarang.css?v=16" />
</head>
<body class="tarang-page theme-page left-menu-web-hamburger tarang-body" data-theme="dark">
    <div class="mobile-title-bar">
        <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-label="Menu"><i class="fas fa-bars"></i></button>
        <div class="mobile-title-content">
            <img src="tradewithcto-logo.png" alt="TradeWithCTO" class="mobile-logo" />
            <h1 class="mobile-title">
                Kosmic Tarang
                <span class="tg-inline-badge tg-badge-paper" id="modeBadgeMobile">Forward test</span>
            </h1>
        </div>
    </div>
    <div class="app-container app-with-left-menu">
        <div id="left-menu-container"></div>
        <main class="right-panel main-content-area">
            <div class="tg-page">
                <div class="settings-header tg-page-header">
                    <div class="settings-title-section">
                        <h1 class="settings-title tg-page-title">
                            <i class="fas fa-wave-square" aria-hidden="true"></i> Kosmic Tarang
                            <span class="tg-inline-badge tg-badge-paper" id="modeBadge">Forward test</span>
                            <span class="tg-inline-badge" id="autoBadge">Auto orders: locked</span>
                        </h1>
                        <p class="settings-subtitle tg-subtitle">Screener, Trade, Report</p>
                    </div>
                    <div class="tg-header-aside">
                        <a class="tg-lab-link" href="tarang-lab.html">Research &amp; Ops</a>
                        <button type="button" class="tg-btn" id="btnRefresh">Refresh</button>
                    </div>
                </div>
                <div class="settings-content">
                    <p id="tokenBanner" class="tg-banner" hidden></p>
                    <p id="statusLine" class="tg-note">Loading…</p>
                    <nav class="tg-tabs" aria-label="Kosmic Tarang views">
                        <button type="button" class="tg-tab active" data-tab="screener">Screener</button>
                        <button type="button" class="tg-tab" data-tab="trade">Trade</button>
                        <button type="button" class="tg-tab" data-tab="report">Report</button>
                    </nav>

                    <div id="tab-screener" class="tg-tab-panel">
                        <section class="tg-card tg-section">
                            <div id="screenerEmpty" class="tg-note" hidden></div>
                            <div id="screenerList" class="tg-screen-list"></div>
                        </section>
                    </div>

                    <div id="tab-trade" class="tg-tab-panel" hidden>
                        <section class="tg-card tg-section">
                            <h2 class="tg-section-title">My trades</h2>
                            <div id="activeList"></div>
                        </section>
                        <section class="tg-card tg-section">
                            <h2 class="tg-section-title">Setup</h2>
                            <div id="symbolChips" class="tg-chips"></div>
                            <div id="candidatePanel"></div>
                        </section>
                    </div>

                    <div id="tab-report" class="tg-tab-panel" hidden>
                        <section class="tg-card tg-section">
                            <div class="tg-ticket-bar">
                                <h2 class="tg-section-title" style="margin:0;">Report</h2>
                                <label class="tg-toggle"><input type="radio" name="book" value="LIVE" /> Live</label>
                                <label class="tg-toggle"><input type="radio" name="book" value="FORWARD_TEST" checked /> Forward test</label>
                                <a class="tg-btn" id="btnCsv" href="/api/tarang/report.csv?book=FORWARD_TEST">CSV</a>
                            </div>
                            <div class="tg-metrics" id="reportMetrics"></div>
                            <div class="tg-table-wrap" style="margin-top:12px;">
                                <table class="tg-table">
                                    <thead>
                                        <tr>
                                            <th>When</th><th>Symbol</th><th>Structure</th><th>Entry</th><th>Exit</th><th>Net</th><th>Reason</th>
                                        </tr>
                                    </thead>
                                    <tbody id="reportBody"><tr><td colspan="7" class="tg-muted">—</td></tr></tbody>
                                </table>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="modalRoot"></div>
    <script src="left-menu.js?v=3.51"></script>
    <script src="tarang.js?v=22"></script>
</body>
</html>
