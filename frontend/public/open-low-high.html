<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Open Low High - TradeWithCTO</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=3" />
    <script src="auth-check.js?v=1"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="settings.css?v=2" />
    <link rel="stylesheet" href="left-menu.css?v=3.48" />
    <link rel="stylesheet" href="theme.css?v=1.4" />
    <link rel="stylesheet" href="open-low-high.css?v=4" />
</head>
<body class="olh-page theme-page left-menu-web-hamburger" data-theme="dark">
    <div class="mobile-title-bar">
        <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-label="Menu"><i class="fas fa-bars"></i></button>
        <div class="mobile-title-content">
            <img src="tradewithcto-logo.png" alt="TradeWithCTO" class="mobile-logo" />
            <h1 class="mobile-title">Open Low High</h1>
        </div>
    </div>
    <div class="app-container app-with-left-menu">
        <div id="left-menu-container"></div>
        <main class="right-panel main-content-area">
            <div class="olh-wrap">
                <header class="olh-header">
                    <div>
                        <h1 class="olh-title"><i class="fas fa-crosshairs" aria-hidden="true"></i> Open Low High</h1>
                        <p class="olh-subtitle">Stock futures — Phase A 09:15 candidates + Phase B 09:20 actives · freezes by 09:27 IST</p>
                    </div>
                    <div class="olh-header-aside">
                        <span class="olh-pill" id="olhStatus">—</span>
                        <span class="olh-pill olh-pill-muted" id="olhDate">—</span>
                        <span class="olh-pill olh-pill-muted" id="olhServerTime">—</span>
                        <button type="button" class="olh-btn" id="olhRefreshBtn" title="Refresh"><i class="fas fa-sync-alt"></i></button>
                        <button type="button" class="olh-btn olh-btn-accent" id="olhForceBtn" title="Force re-screen (outside window / rebuild)">Force</button>
                    </div>
                </header>

                <p class="olh-banner" id="olhBanner" hidden></p>

                <nav class="olh-tabs" role="tablist" aria-label="Open Low High views">
                    <button type="button" class="olh-tab active" role="tab" aria-selected="true" data-olh-tab="screen" id="olhTabScreen">Screen</button>
                    <button type="button" class="olh-tab" role="tab" aria-selected="false" data-olh-tab="log" id="olhTabLog">Trade Log</button>
                </nav>

                <section class="olh-panel" id="olhPanelScreen" role="tabpanel" aria-labelledby="olhTabScreen" data-olh-panel="screen">
                    <div class="olh-columns">
                        <div class="olh-section olh-col olh-col-bull">
                            <h2 class="olh-section-title olh-bull">
                                <span class="olh-section-title-left"><i class="fas fa-arrow-trend-up"></i> Bullish <span class="olh-count" id="olhBullCount">0</span></span>
                                <span class="olh-nifty-cue olh-nifty-cue--bull" id="olhNiftyBull" hidden>NIFTY</span>
                            </h2>
                            <div class="olh-col-body" id="olhBullGrid"></div>
                            <p class="olh-empty" id="olhBullEmpty">No bullish cards yet.</p>
                        </div>
                        <div class="olh-col-divider" aria-hidden="true"></div>
                        <div class="olh-section olh-col olh-col-bear">
                            <h2 class="olh-section-title olh-bear">
                                <span class="olh-section-title-left"><i class="fas fa-arrow-trend-down"></i> Bearish <span class="olh-count" id="olhBearCount">0</span></span>
                                <span class="olh-nifty-cue olh-nifty-cue--bear" id="olhNiftyBear" hidden>NIFTY</span>
                            </h2>
                            <div class="olh-col-body" id="olhBearGrid"></div>
                            <p class="olh-empty" id="olhBearEmpty">No bearish cards yet.</p>
                        </div>
                    </div>
                </section>

                <section class="olh-panel" id="olhPanelLog" role="tabpanel" aria-labelledby="olhTabLog" data-olh-panel="log" hidden>
                    <div class="olh-log-toolbar">
                        <label class="olh-label">Side
                            <select id="olhLogSide" class="olh-select">
                                <option value="">All</option>
                                <option value="BULLISH">Bullish</option>
                                <option value="BEARISH">Bearish</option>
                            </select>
                        </label>
                        <button type="button" class="olh-btn" id="olhLogReload"><i class="fas fa-sync-alt"></i> Reload</button>
                    </div>
                    <div id="olhLogHost"></div>
                    <p class="olh-empty" id="olhLogEmpty" hidden>No stored screen rows yet.</p>
                </section>
            </div>
        </main>
    </div>

    <script src="theme.js?v=1.4"></script>
    <script src="left-menu.js?v=3.59"></script>
    <script src="open-low-high.js?v=4"></script>
</body>
</html>
