<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Analysis | TradeWithCTO</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=3">
    <script src="auth-check.js?v=1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="settings.css">
    <link rel="stylesheet" href="left-menu.css?v=3.28">
    <link rel="stylesheet" href="theme.css?v=1.3">
    <link rel="stylesheet" href="volume-mismatch-backtest.css?v=2">
    <link rel="stylesheet" href="analysis.css?v=4">
</head>
<body class="theme-page" data-theme="dark">
    <div class="mobile-title-bar">
        <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-label="Menu"><i class="fas fa-bars"></i></button>
        <div class="mobile-title-content">
            <img src="tradewithcto-logo.png" alt="TradeWithCTO" class="mobile-logo">
            <h1 class="mobile-title">Analysis</h1>
        </div>
    </div>
    <div class="app-container app-with-left-menu">
        <div id="left-menu-container"></div>
        <main class="right-panel main-content-area">
            <div class="settings-header">
                <div class="settings-title-section">
                    <h1 class="settings-title"><i class="fas fa-table"></i> Analysis</h1>
                    <p class="settings-subtitle">NSE cash OHLC, weekly/daily trend, RSI zones, and sector RS.</p>
                </div>
                <div class="vmb-header-actions">
                    <button type="button" class="vmb-theme-btn an-info-btn" id="anInfoBtn" aria-label="About this page">
                        <i class="fas fa-info" aria-hidden="true"></i>
                        <span class="an-info-tip" role="tooltip">NSE cash (equity) OHLC for every arbitrage_master name. Weekly/daily trend from last 10 bars (prior 5 vs recent 5 highs/lows, 0.5% band). Weekly RSI(14): &gt;65 OverBought, &lt;35 OverSold, else Mid. RS = stock close / sector-index close vs SMA 50.</span>
                    </button>
                    <button type="button" class="vmb-theme-btn" id="anReloadBtn" title="Reload"><i class="fas fa-sync"></i></button>
                </div>
            </div>
            <div class="vmb-wrap">
                <div class="vmb-summary">
                    <div class="vmb-stat"><span class="vmb-stat-label">Rows</span><span class="vmb-stat-val" id="anCount">—</span></div>
                    <div class="vmb-stat"><span class="vmb-stat-label">Updated</span><span class="vmb-stat-val vmb-stat-small" id="anUpdated">—</span></div>
                    <div class="vmb-stat"><span class="vmb-stat-label">Visible</span><span class="vmb-stat-val" id="anVisible">—</span></div>
                </div>
                <div class="an-filters" id="anFilters">
                    <label>Sector <select id="anSector"><option value="">All</option></select></label>
                    <label>Action <select id="anAction"><option value="">All</option><option value="BUY">BUY</option><option value="SELL">SELL</option><option value="SELL (Exhaustion)">SELL (Exhaustion)</option><option value="WATCH">WATCH</option><option value="--">--</option></select></label>
                    <label>Weekly <select id="anWTrend"><option value="">All</option><option>Bullish</option><option>Bearish</option><option>Sideways</option></select></label>
                    <label>Daily <select id="anDTrend"><option value="">All</option><option>Bullish</option><option>Bearish</option><option>Sideways</option></select></label>
                    <label>RSI <select id="anRsi"><option value="">All</option><option>OverBought</option><option>OverSold</option><option>Mid</option></select></label>
                    <label>Comp RS <select id="anRs"><option value="">All</option><option>Above</option><option>Below</option><option>Mid</option></select></label>
                    <label>Pattern <select id="anPat"><option value="">All</option></select></label>
                    <input type="search" id="anSearch" placeholder="Symbol…" autocomplete="off">
                </div>
                <div class="vmb-table-wrap">
                    <table class="vmb-table" id="anTable">
                        <thead>
                            <tr>
                                <th data-k="symbol">Symbol</th>
                                <th data-k="sector">Sector</th>
                                <th data-k="action">Action</th>
                                <th data-k="weekly_trend">Weekly</th>
                                <th data-k="daily_trend">Daily</th>
                                <th data-k="weekly_rsi_zone">W RSI</th>
                                <th data-k="rs_ma50">Comp RS</th>
                                <th data-k="patterns">Patterns</th>
                            </tr>
                        </thead>
                        <tbody id="anBody"><tr><td colspan="8" class="vmb-empty">Loading…</td></tr></tbody>
                    </table>
                </div>
                <p class="vmb-footer" id="anFooter"></p>
            </div>
        </main>
    </div>
    <script src="left-menu.js?v=3.30"></script>
    <script src="analysis.js?v=4"></script>
</body>
</html>
