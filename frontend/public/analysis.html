<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Analysis | TradeWithCTO</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=3">
    <script src="auth-check.js?v=1"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="settings.css?v=2">
    <link rel="stylesheet" href="left-menu.css?v=3.48">
    <link rel="stylesheet" href="theme.css?v=1.4">
    <link rel="stylesheet" href="volume-mismatch-backtest.css?v=3">
    <link rel="stylesheet" href="analysis.css?v=5">
</head>
<body class="analysis-page theme-page left-menu-web-hamburger" data-theme="dark">
    <div class="mobile-title-bar">
        <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-label="Menu"><i class="fas fa-bars"></i></button>
        <div class="mobile-title-content">
            <img src="tradewithcto-logo.png" alt="TradeWithCTO" class="mobile-logo">
            <h1 class="mobile-title">Analysis</h1>
        </div>
    </div>
    <div class="app-container app-with-left-menu">
        <div id="left-menu-container"></div>
        <main class="right-panel main-content-area">
            <div class="an-page">
                <div class="an-page-header">
                    <div class="an-title-section">
                        <h1 class="an-page-title"><i class="fas fa-table" aria-hidden="true"></i> Analysis</h1>
                        <p class="an-subtitle">NSE cash OHLC, weekly/daily trend, RSI zones, and sector RS.</p>
                    </div>
                    <div class="an-header-actions">
                        <button type="button" class="an-icon-btn an-info-btn" id="anInfoBtn" aria-label="About this page">
                            <i class="fas fa-info" aria-hidden="true"></i>
                            <span class="an-info-tip" role="tooltip">NSE cash (equity) OHLC for every arbitrage_master name. Weekly/daily trend from last 10 bars (prior 5 vs recent 5 highs/lows, 0.1% band). Weekly RSI(14): &gt;65 OverBought, &lt;35 OverSold, else Mid. RS = stock close / sector-index close vs SMA 50.</span>
                        </button>
                        <button type="button" class="an-icon-btn" id="anReloadBtn" title="Reload"><i class="fas fa-sync"></i></button>
                    </div>
                </div>
                <div class="an-wrap">
                    <div class="an-summary">
                        <div class="an-stat"><span class="an-stat-label">Rows</span><span class="an-stat-val" id="anCount">—</span></div>
                        <div class="an-stat"><span class="an-stat-label">Updated</span><span class="an-stat-val an-stat-small" id="anUpdated">—</span></div>
                        <div class="an-stat"><span class="an-stat-label">Visible</span><span class="an-stat-val" id="anVisible">—</span></div>
                    </div>
                    <div class="an-filters" id="anFilters">
                        <label>Sector <select id="anSector"><option value="">All</option></select></label>
                        <label>Action <select id="anAction"><option value="">All</option><option value="BUY">BUY</option><option value="SELL">SELL</option><option value="SELL (Exhaustion)">SELL (Exhaustion)</option><option value="WATCH">WATCH</option><option value="--">--</option></select></label>
                        <label>Weekly <select id="anWTrend"><option value="">All</option><option>Bullish</option><option>Bearish</option><option>Sideways</option></select></label>
                        <label>Daily <select id="anDTrend"><option value="">All</option><option>Bullish</option><option>Bearish</option><option>Sideways</option></select></label>
                        <label>RSI <select id="anRsi"><option value="">All</option><option>OverBought</option><option>OverSold</option><option>Mid</option></select></label>
                        <label>Comp RS <select id="anRs"><option value="">All</option><option>Above</option><option>Below</option><option>Mid</option></select></label>
                        <label>Pattern <select id="anPat"><option value="">All</option></select></label>
                        <input type="search" id="anSearch" placeholder="Symbol…" autocomplete="off">
                    </div>
                    <div class="an-table-wrap">
                        <table class="an-table vmb-table" id="anTable">
                            <thead>
                                <tr>
                                    <th data-k="symbol">Symbol</th>
                                    <th data-k="sector">Sector</th>
                                    <th data-k="action">Action</th>
                                    <th data-k="weekly_trend">Weekly</th>
                                    <th data-k="daily_trend">Daily</th>
                                    <th data-k="weekly_rsi_zone">W RSI</th>
                                    <th data-k="rs_ma50">Comp RS</th>
                                    <th data-k="patterns">Patterns</th>
                                </tr>
                            </thead>
                            <tbody id="anBody"><tr><td colspan="8" class="an-empty">Loading…</td></tr></tbody>
                        </table>
                    </div>
                    <p class="an-footer" id="anFooter"></p>
                </div>
            </div>
        </main>
    </div>
    <script src="left-menu.js?v=3.48"></script>
    <script src="analysis.js?v=4"></script>
</body>
</html>
