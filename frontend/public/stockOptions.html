<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Stock Options - TradeWithCTO</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=3" />
    <script src="auth-check.js?v=1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="settings.css" />
    <link rel="stylesheet" href="left-menu.css?v=3.24" />
    <link rel="stylesheet" href="theme.css?v=1.3" />
    <link rel="stylesheet" href="stockOptions.css?v=3" />
</head>
<body class="theme-page stock-options-body">
    <div class="mobile-title-bar">
        <button class="mobile-menu-toggle" id="mobileMenuToggleLegacy" type="button" aria-label="Menu"><i class="fas fa-bars"></i></button>
        <div class="mobile-title-content">
            <img src="tradewithcto-logo.png" alt="TradeWithCTO" class="mobile-logo" />
            <i class="fas fa-chart-line" style="font-size:1.5rem;color:var(--theme-accent,#2563eb);" aria-hidden="true"></i>
            <h1 class="mobile-title">Stock Options</h1>
        </div>
    </div>
    <div class="app-container app-with-left-menu">
        <div id="left-menu-container"></div>
        <main class="right-panel main-content-area">
            <div class="settings-header">
                <div class="settings-title-section">
                    <h1 class="settings-title"><i class="fas fa-chart-line" style="margin-right:10px;color:#2563eb;"></i> Stock Options</h1>
                    <p class="settings-subtitle">Williams %R radar, 2-hour EMA arm, credit spreads. Trade click does not execute until Submit.</p>
                </div>
            </div>
            <div class="settings-content">
                <p id="soBanner" class="so-note"></p>
                <nav class="bf-tabs" aria-label="Stock Options views">
                    <button type="button" class="bf-tab active" data-tab="radar">Radar</button>
                    <button type="button" class="bf-tab" data-tab="active">Active</button>
                    <button type="button" class="bf-tab" data-tab="executed">Executed</button>
                </nav>
                <div class="so-card">
                    <p class="so-note" id="soExecutedNote" hidden>Ensure GTT order at this price for SELL leg</p>
                    <div id="soPanel"></div>
                </div>
            </div>
        </main>
    </div>

    <div class="so-modal" id="soTradeModal" hidden>
        <div class="so-modal-card" role="dialog" aria-modal="true" aria-labelledby="soTradeTitle">
            <h2 id="soTradeTitle">Trade</h2>
            <p id="soTradeSymbol" class="so-note"></p>
            <p class="so-modal-msg">First BUY then SELL in a basket order</p>
            <form id="soTradeForm">
                <div class="so-field">
                    <label for="soBuyStrike">Buy side — 18Δ strike</label>
                    <input id="soBuyStrike" type="number" step="0.05" required />
                </div>
                <div class="so-field">
                    <label for="soBuyCost">Buy side cost</label>
                    <input id="soBuyCost" type="number" step="0.05" min="0" required />
                </div>
                <div class="so-field">
                    <label for="soSellStrike">Sell side — 28Δ strike</label>
                    <input id="soSellStrike" type="number" step="0.05" required />
                </div>
                <div class="so-field">
                    <label for="soSellCost">Sell side cost</label>
                    <input id="soSellCost" type="number" step="0.05" min="0" required />
                </div>
                <div class="so-field">
                    <label for="soDateTraded">Date of trade</label>
                    <input id="soDateTraded" type="date" required />
                </div>
                <p id="soTradeErr" class="so-err"></p>
                <div class="so-modal-actions">
                    <button type="button" class="so-modal-btn secondary" id="soTradeCancel">Cancel</button>
                    <button type="submit" class="so-modal-btn primary">Submit</button>
                </div>
            </form>
        </div>
    </div>
    <script src="left-menu.js?v=3.31"></script>
    <script src="stockOptions.js?v=4"></script>
</body>
</html>
