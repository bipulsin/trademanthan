<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>MomentX Backtest - TradeWithCTO</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=3" />
  <script src="auth-check.js?v=1"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="settings.css?v=2" />
  <link rel="stylesheet" href="left-menu.css?v=3.48" />
  <link rel="stylesheet" href="theme.css?v=1.4" />
  <link rel="stylesheet" href="momentx.css?v=1.8" />
</head>
<body class="momentx-page theme-page left-menu-web-hamburger" data-theme="dark">
  <div class="mobile-title-bar">
    <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-label="Menu"><i class="fas fa-bars"></i></button>
    <div class="mobile-title-content">
      <img src="tradewithcto-logo.png" alt="TradeWithCTO" class="mobile-logo" />
      <h1 class="mobile-title">MomentX Backtest</h1>
    </div>
  </div>
  <div class="app-container app-with-left-menu">
    <div id="left-menu-container"></div>
    <main class="right-panel main-content-area">
      <div class="mx-page">
        <header class="mx-head">
          <div>
            <h1 class="mx-page-title"><i class="fas fa-flask" aria-hidden="true"></i> MomentX Backtest</h1>
            <p class="mx-lede">Stage-1 bullish + bearish qualifiers by trading day. Re-run any past month/range.</p>
          </div>
          <div class="mx-meta">
            <a class="mx-btn" href="momentx.html"><i class="fas fa-bolt"></i> MomentX</a>
            <a class="mx-btn" href="momentxlog.html"><i class="fas fa-book"></i> Trade Log</a>
          </div>
        </header>

        <section class="mx-bt-controls" aria-label="Backtest range">
          <label class="mx-filter-label">From
            <input type="date" id="mxBtFrom" class="mx-input" value="2026-08-01" />
          </label>
          <label class="mx-filter-label">To
            <input type="date" id="mxBtTo" class="mx-input" value="2026-09-20" />
          </label>
          <label class="mx-filter-label">As-of IST
            <input type="time" id="mxBtAsof" class="mx-input" value="14:45" />
          </label>
          <label class="mx-toggle" title="When on, hide rows that fail Day Vol &gt; SMA(Vol,5)">
            <input type="checkbox" id="mxBtVolFilter" checked />
            <span>Volume filter</span>
          </label>
          <button type="button" class="mx-btn mx-btn-primary" id="mxBtRun">
            <i class="fas fa-play"></i> Run backtest
          </button>
          <button type="button" class="mx-btn" id="mxBtReload">
            <i class="fas fa-sync-alt"></i> Reload results
          </button>
          <span class="mx-badge" id="mxBtStatus">Status: —</span>
        </section>

        <div id="mxBtLoading" class="mx-status">Loading backtest results…</div>
        <div id="mxBtError" class="mx-status mx-error" hidden></div>
        <div id="mxBtEmpty" class="mx-status" hidden>No qualified symbols stored for this range yet. Run a backtest.</div>
        <div id="mxBtSummary" class="mx-bt-summary" hidden></div>
        <div id="mxBtRoot" class="mx-log-root" hidden></div>
      </div>
    </main>
  </div>

  <script src="left-menu.js?v=3.53"></script>
  <script src="mXback.js?v=1.3"></script>
</body>
</html>
